<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevator Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
        }

        .hidden {
            display: none !important;
        }

        #elevator-container {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }

        .elevator-menu {
            width: 420px;
            background: linear-gradient(135deg, rgba(40, 20, 60, 0.95) 0%, rgba(60, 30, 90, 0.95) 100%);
            border: 2px solid rgba(200, 100, 200, 0.6);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(150, 70, 150, 0.3);
        }

        .menu-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-icon {
            font-size: 40px;
            margin-bottom: 10px;
            color: rgba(200, 100, 200, 0.9);
        }

        .menu-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .menu-header p {
            font-size: 14px;
            color: rgba(255, 150, 200, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(200, 100, 200, 0.8), transparent);
        }

        .floors-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
            max-height: 400px;
            overflow-y: auto;
            padding: 2px;
            scrollbar-width: none;
        }

        .floors-container::-webkit-scrollbar {
            display: none;
        }

        .floor-button {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 70px;
            padding: 15px 18px;
            background: linear-gradient(135deg, rgba(150, 70, 150, 0.3), rgba(100, 40, 120, 0.3));
            border: 2px solid rgba(200, 100, 200, 0.5);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            flex-shrink: 0;
        }

        .floor-button:hover {
            background: linear-gradient(135deg, rgba(150, 70, 150, 0.5), rgba(100, 40, 120, 0.5));
            border-color: rgba(200, 100, 200, 0.8);
            box-shadow: 0 4px 15px rgba(150, 70, 150, 0.4);
            transform: translateY(-2px);
        }

        .floor-icon {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(200, 100, 200, 0.3);
            border-radius: 8px;
            margin-right: 15px;
            border: 1px solid rgba(200, 100, 200, 0.5);
            flex-shrink: 0;
        }

        .floor-icon i {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.95);
        }

        .floor-info {
            flex: 1;
            min-width: 0;
        }

        .floor-label {
            font-size: 12px;
            color: rgba(200, 100, 200, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .floor-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .floor-arrow {
            color: rgba(200, 100, 200, 0.6);
            font-size: 14px;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .menu-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 15px;
            border-top: 1px solid rgba(200, 100, 200, 0.3);
            gap: 10px;
            color: rgba(200, 100, 200, 0.7);
            font-size: 12px;
        }

        .key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: rgba(200, 100, 200, 0.2);
            border: 1px solid rgba(200, 100, 200, 0.4);
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <motion.div id="elevator-container" class="hidden">
        <div class="elevator-menu">
            <div class="menu-header">
                <div class="header-icon"><i class="fas fa-elevator"></i></div>
                <h1>ELEVADOR</h1>
                <p>Escolher Andar</p>
                <div class="divider"></div>
            </div>

            <div class="floors-container" id="floorsContainer"></div>

            <div class="menu-footer">
                <span class="key">ESC</span>
                <span>Fechar</span>
            </div>
        </div>
    </div>

    <script>
        let isMenuOpen = false;
        let currentBuilding = null;

        window.addEventListener('message', (event) => {
            const data = event.data;

            if (data.type === 'openMenu') {
                openMenu(data.building, data.floors);
            } else if (data.type === 'closeMenu') {
                closeMenu();
            }
        });

        function getFloorIconClass(icon) {
            if (!icon) return 'fas fa-map-pin';
            if (icon.includes('fa-')) {
                return icon.startsWith('fas ') || icon.startsWith('far ') || icon.startsWith('fab ')
                    ? icon
                    : 'fas ' + icon;
            }
            return 'fas fa-' + icon;
        }

        function openMenu(building, floors) {
            currentBuilding = building;
            isMenuOpen = true;

            const container = document.getElementById('elevator-container');
            const floorsContainer = document.getElementById('floorsContainer');

            floorsContainer.innerHTML = '';

            if (floors && floors.length > 0) {
                floors.forEach(floor => {
                    const btn = document.createElement('div');
                    btn.className = 'floor-button';

                    const iconClass = getFloorIconClass(floor.icon);

                    btn.innerHTML = `
                        <div class="floor-icon"><i class="${iconClass}"></i></div>
                        <div class="floor-info">
                            <div class="floor-label">Andar ${floor.floor}</div>
                            <motion.div class="floor-name">${floor.label}</div>
                        </div>
                        <div class="floor-arrow"><i class="fas fa-chevron-right"></i></div>
                    `;

                    btn.addEventListener('click', () => selectFloor(floor));
                    floorsContainer.appendChild(btn);
                });
            }

            container.classList.remove('hidden');
        }

        function closeMenu() {
            isMenuOpen = false;
            document.getElementById('elevator-container').classList.add('hidden');
            currentBuilding = null;
        }

        function selectFloor(floor) {
            closeMenu();
            fetch(`https://${GetParentResourceName()}/selectFloor`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    building: currentBuilding,
                    floor: floor
                })
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isMenuOpen) {
                closeMenu();
                fetch(`https://${GetParentResourceName()}/closeMenu`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
            }
        });

        function GetParentResourceName() {
            return 'ox_elevador';
        }
    </script>
</body>
</html>
